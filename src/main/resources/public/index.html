<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PokéJourney</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

<main class="login-container">

    <h1>PokéJourney</h1>

    <section class="login-box">

        <h2>Login</h2>

        <form id="login-form">

            <label for="username">Username</label>
            <input
                    id="username"
                    type="text"
                    required
            >

            <label for="password">Password</label>
            <input
                    id="password"
                    type="password"
                    required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p id="login-error"></p>

    </section>

</main>

<script src="app.js"></script>

</body>
</html>
